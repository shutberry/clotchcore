[workspace]

[package]
name = "heavi"
version = "0.1.0"
edition = "2021"
default-run = "heavi"
autobins = false
autotests = false

[[bin]]
name = "heavi"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
async-trait = "0.1"
thiserror = "1"
axum = "0.7"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sysinfo = "0.30"
regex = "1"
yuv = "0.8.19"
discord-rich-presence = "0.2"
flate2 = "1.0"
fast_image_resize = "6.1.0"
parking_lot = "0.12.5"
sha2 = "0.10"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Performance",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_System_ProcessStatus",
    "Win32_Storage_FileSystem",
    "Win32_Security"
] }
bytes = "1"
chrono = "0.4"
rusty_h264-common = "0.16.1"
rusty_h264-encoder = "0.16.1"
mp4 = "0.14.0"
fdk-aac-rs = "0.1.0"
uuid = { version = "1.0", features = ["v4"] }
crossbeam-channel = "0.5.17"
openh264 = "0.9"
moq-video = "0.1.17"
gigi-core = "0.1.0"
picoring = "0.6.0"
eframe = "0.29"
egui = "0.29"
trash = "5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true